<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Didoo's Evergreen</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Cormorant+Garamond:ital,wght@1,600;1,700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/home.css" />

  <!--
    TODO: Replace placeholder below with the actual Figma design
    once node 296:8407 is available (Figma rate limit reset).
    Share a screenshot and this file will be updated accordingly.
  -->
  <style>
    /* ── Placeholder home page styles ── */
    .home-scroll {
      flex: 1 0 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: var(--sp4);
      display: flex;
      flex-direction: column;
      gap: var(--sp3);
      scrollbar-width: none;
    }
    .home-scroll::-webkit-scrollbar { display: none; }

    .section-title {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: -0.48px;
      color: var(--ev-lime-dim);
      text-transform: uppercase;
      padding: var(--sp2) 0 var(--sp1);
    }

    /* Category card */
    .category-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--sp3) var(--sp4);
      border: var(--ev-border) solid var(--ev-bg-border);
      border-radius: var(--sp2);
      background: var(--ev-lime-ghost);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .category-card:active,
    .category-card:hover {
      background: rgba(200, 245, 106, 0.15);
      border-color: var(--ev-lime-border);
    }

    .card-label {
      font-size: 16px;
      font-weight: 500;
      line-height: 20.8px;
      letter-spacing: -0.64px;
      color: var(--ev-white);
    }

    .card-arrow {
      width: 18px;
      height: 18px;
      stroke: var(--ev-lime);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- iOS top safe area -->
  <div class="safe-top"></div>

  <!-- TOP BAR (no back button on home) -->
  <header class="top-bar">
    <span></span><!-- spacer -->
    <div class="ev-logo" aria-label="Didoo's Evergreen">
      <div class="logo-stack">
        <img
          class="logo-didoos-img"
          src="https://www.figma.com/api/mcp/asset/09dd085e-7286-4a66-a9c4-5b9d3f111dd4"
          alt="Didoo's"
        />
        <div class="logo-evergreen-wrap">
          <img
            class="logo-evergreen-img"
            src="https://www.figma.com/api/mcp/asset/d097ef31-20e3-42d2-abf9-46b8db3db95a"
            alt="Evergreen"
          />
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="home-scroll">

    <p class="section-title">Mains</p>

    <!-- Clicking Indian → goes to the Indian menu page -->
    <a class="category-card" href="pages/menu-indian.html" aria-label="View Indian menu">
      <span class="card-label">Indian</span>
      <svg class="card-arrow" viewBox="0 0 24 24" aria-hidden="true">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </a>

    <a class="category-card" href="#" aria-label="View Chinese menu (coming soon)">
      <span class="card-label">Chinese</span>
      <svg class="card-arrow" viewBox="0 0 24 24" aria-hidden="true">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </a>

    <a class="category-card" href="#" aria-label="View BBQ menu (coming soon)">
      <span class="card-label">BBQ</span>
      <svg class="card-arrow" viewBox="0 0 24 24" aria-hidden="true">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </a>

    <a class="category-card" href="#" aria-label="View Intercontinental menu (coming soon)">
      <span class="card-label">Intercontinental</span>
      <svg class="card-arrow" viewBox="0 0 24 24" aria-hidden="true">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </a>

    <a class="category-card" href="#" aria-label="View Italian menu (coming soon)">
      <span class="card-label">Italian</span>
      <svg class="card-arrow" viewBox="0 0 24 24" aria-hidden="true">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </a>

  </main>

  <!-- iOS bottom safe area -->
  <div class="safe-bottom"></div>
</div>

<!-- Scripts -->
<script src="js/navigation.js"></script>
</body>
</html>
