<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Indian Menu — Didoo's Evergreen Café" />
  <title>Indian Menu — Didoo's Evergreen</title>
  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/pages/main-indian.css" />
</head>
<body>
<div class="shell">

  <!-- 1. SAFE TOP — 44px -->
  <div class="safe-top"></div>

  <!-- 2. TOP BAR — 390×55 -->
  <div class="top-bar">

    <!-- Back button — 70×26 | navigates to main-menu with slide-right -->
    <button class="topbar-back" onclick="navigateBack('main-menu.html')">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M8.75 11.5L4.25 7L8.75 2.5" stroke="#C8F56A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back
    </button>

    <!-- Welcome logo — 97×31 -->
    <img class="topbar-logo" src="../assets/Didoo's logo caps.svg" alt="Didoo's Evergreen" />

  </div>

  <!-- 3. SEARCH BAR — 390×77 -->
  <div class="search-bar">

    <div class="search-input-wrap">
      <!-- search icon -->
      <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="5" stroke="#C8F56A" stroke-opacity="0.55" stroke-width="1.5"/>
        <path d="M11 11L14 14" stroke="#C8F56A" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input class="search-input" type="text" placeholder="Search Menu" />
    </div>

  </div>

  <!-- 4. TAB BAR — 390×68 -->
  <div class="tab-bar" id="tabBar">
    <!-- tabs injected by JS -->
  </div>

  <!-- 5. SCROLL AREA — 390×500 -->
  <div class="scroll-area" id="scrollArea">
    <!-- dish content injected by JS from assets/menu_final.json -->
  </div>

  <!-- 6. BOTTOM BAR — 390×66 -->
  <div class="bottom-bar" id="bottomBar">
    <!-- single dietary badge — updated when + is tapped -->
    <div class="diet-types" id="dietBadge" style="visibility:hidden;"></div>
    <!-- checkout counter -->
    <div class="checkout-counter" id="checkoutCounter" onclick="goToCheckout()" style="cursor:pointer;">
      <img src="../assets/list.png" width="16" height="16" alt="cart" class="checkout-icon" />
      <span class="checkout-label">Checkout</span>
      <span class="checkout-items" id="checkoutItems">0 Items</span>
    </div>
  </div>

  <!-- 7. SAFE BOTTOM — 34px -->
  <div class="safe-bottom"></div>

</div>
<script src="../js/navigation.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/pages/menu-list.js"></script>
</body>
</html>
