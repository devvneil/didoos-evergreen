<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Didoo's Evergreen</title>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/pages/welcome.css" />
  <link rel="prefetch" href="pages/wifi-connect.html" />
</head>
<body>
<div class="shell">

  <div class="safe-top"></div>

  <main class="welcome-scene" role="button" tabindex="0" aria-label="Tap to enter Didoo's Evergreen">
    <div class="welcome-content">

      <div class="welcome-logo">
        <img
          class="welcome-logo-vector"
          src="assets/Welcome Logo.svg"
          alt="Didoo's Evergreen"
          draggable="false"
        />
      </div>

      <p class="welcome-tagline">Come hungry. Leave happy.</p>

    </div>
  </main>

  <div class="safe-bottom"></div>

</div>
<script>
  function navigateTo(page) {
    var shell = document.querySelector('.shell');
    shell.style.transition = 'transform 300ms ease-out, opacity 300ms ease-out';
    shell.style.transform = 'translateX(-100%)';
    shell.style.opacity = '0';
    setTimeout(function () { window.location.href = page; }, 300);
  }

  var scene = document.querySelector('.welcome-scene');
  scene.addEventListener('click', function () { navigateTo('pages/wifi-connect.html'); });
  scene.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') navigateTo('pages/wifi-connect.html');
  });
</script>
</body>
</html>
