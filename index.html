<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Didoo's Evergreen</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Cormorant+Garamond:ital,wght@1,600;1,700&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/pages/home.css" />
</head>
<body>
<div class="shell">

  <!-- iOS top safe area -->
  <div class="safe-top"></div>

  <!-- SCATTER SCENE — no top/bottom bars on home screen -->
  <main class="home-scene" aria-label="Menu categories">

    <!-- ── CATEGORY NODES ── -->

    <!-- Breakfast — top right -->
    <a class="category-node node--breakfast" href="#" aria-label="Breakfast menu">
      <div class="node-circle">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <!-- Cup body -->
          <path d="M6 10h12v7a2 2 0 01-2 2H8a2 2 0 01-2-2v-7z"/>
          <!-- Handle -->
          <path d="M18 12h1.5a2 2 0 010 4H18"/>
          <!-- Saucer -->
          <path d="M4 20h16"/>
          <!-- Steam -->
          <path d="M9 7c0-1 1-1.5 1-2.5S9 3 9 2"/>
          <path d="M13 7c0-1 1-1.5 1-2.5S13 3 13 2"/>
        </svg>
      </div>
      <span class="node-label">Breakfast</span>
    </a>

    <!-- Starters — centre -->
    <a class="category-node node--starters" href="#" aria-label="Starters menu">
      <div class="node-circle">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <!-- Bowl -->
          <path d="M4 12h16v1a8 4 0 01-16 0v-1z"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <!-- Garnish leaves -->
          <path d="M9 8c-1-3 2-5 4-4-1 2-1 4 0 5"/>
          <path d="M14 8c1-3 4-3 4-1-1 2-2 3-2 4"/>
          <circle cx="11" cy="10" r="1" class="icon-fill"/>
        </svg>
      </div>
      <span class="node-label">Starters</span>
    </a>

    <!-- Israeli — left -->
    <a class="category-node node--israeli" href="#" aria-label="Israeli menu">
      <div class="node-circle">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <!-- Star of David: two overlapping triangles -->
          <polygon points="12,3 21.5,19.5 2.5,19.5" stroke-linejoin="round"/>
          <polygon points="12,21 2.5,4.5 21.5,4.5"  stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="node-label">Israeli</span>
    </a>

    <!-- Mains — far left → links to Indian menu -->
    <a class="category-node node--mains" href="pages/menu-indian.html" aria-label="Mains menu">
      <div class="node-circle">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <!-- Plate -->
          <circle cx="13" cy="14" r="6"/>
          <circle cx="13" cy="14" r="3.5"/>
          <!-- Fork -->
          <line x1="5" y1="6"  x2="5" y2="20"/>
          <line x1="7" y1="6"  x2="7" y2="10"/>
          <path d="M5 10 Q6 12 7 10"/>
          <line x1="6" y1="6"  x2="6" y2="8"/>
        </svg>
      </div>
      <span class="node-label">Mains</span>
    </a>

    <!-- Bakes — left -->
    <a class="category-node node--bakes" href="#" aria-label="Bakes menu">
      <div class="node-circle">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <!-- Pizza circle -->
          <circle cx="12" cy="12" r="9"/>
          <!-- Slices -->
          <line x1="12" y1="3" x2="12" y2="21"/>
          <line x1="3.8" y1="7.5" x2="20.2" y2="16.5"/>
          <line x1="3.8" y1="16.5" x2="20.2" y2="7.5"/>
          <!-- Toppings -->
          <circle cx="9"  cy="9.5" r="1.2" class="icon-fill"/>
          <circle cx="15" cy="9.5" r="1.2" class="icon-fill"/>
          <circle cx="9"  cy="15" r="1.2" class="icon-fill"/>
        </svg>
      </div>
      <span class="node-label">Bakes</span>
    </a>

    <!-- Drinks — centre -->
    <a class="category-node node--drinks" href="#" aria-label="Drinks menu">
      <div class="node-circle">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <!-- Glass -->
          <path d="M5 3l2 12h10l2-12H5z"/>
          <!-- Stem -->
          <line x1="12" y1="15" x2="12" y2="21"/>
          <!-- Base -->
          <line x1="8" y1="21" x2="16" y2="21"/>
          <!-- Straw -->
          <line x1="15" y1="5" x2="19" y2="1"/>
          <!-- Cherry -->
          <circle cx="19" cy="1" r="1.5" class="icon-fill"/>
        </svg>
      </div>
      <span class="node-label">Drinks</span>
    </a>

    <!-- Desserts — bottom right -->
    <a class="category-node node--desserts" href="#" aria-label="Desserts menu">
      <div class="node-circle">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <!-- Bowl -->
          <path d="M5 17h14l-1 3H6l-1-3z"/>
          <path d="M5 17a7 7 0 0114 0"/>
          <!-- Scoops -->
          <circle cx="9"  cy="13" r="3"/>
          <circle cx="15" cy="13" r="3"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
      </div>
      <span class="node-label">Desserts</span>
    </a>

    <!-- ── LARGE LOGO ── -->
    <div class="home-logo" aria-label="Didoo's Evergreen">
      <span class="home-logo-didoos">Didoo's</span>
      <div class="home-logo-evergreen-row">
        <span class="home-logo-evergreen-text">Evergreen</span>
        <!-- Leaf SVG -->
        <svg class="home-logo-leaf" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M17 8C17 8 16 3 12 2C8 1 4 4 4 9C4 13.5 7.5 17 11 18.2V22H13V18C16 16.5 20 13 20 9C20 5.5 18 3 18 3L17 8Z" fill="#c8f56a"/>
          <path d="M12 8 Q11 12 9 17" stroke="#0d1a09" stroke-width="0.9" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

  </main>

  <!-- iOS bottom safe area -->
  <div class="safe-bottom"></div>
</div>

<!-- Scripts -->
<script src="js/navigation.js"></script>
</body>
</html>
