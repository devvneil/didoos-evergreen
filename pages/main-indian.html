<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Indian Menu — Didoo's Evergreen Café" />
  <title>Indian Menu — Didoo's Evergreen</title>
  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/pages/main-indian.css" />
</head>
<body>
<div class="shell">

  <!-- 1. SAFE TOP — 44px -->
  <div class="safe-top"></div>

  <!-- 2. TOP BAR — 390×55 -->
  <div class="top-bar">

    <!-- Back button — 70×26 | navigates to main-menu with slide-right -->
    <button class="topbar-back" onclick="navigateBack('main-menu.html')">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M8.75 11.5L4.25 7L8.75 2.5" stroke="#C8F56A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back
    </button>

    <!-- Welcome logo — 97×31 -->
    <img class="topbar-logo" src="../assets/Didoo's logo caps.svg" alt="Didoo's Evergreen" />

  </div>

  <!-- 3. SEARCH BAR — 390×77 -->
  <div class="search-bar">

    <div class="search-input-wrap">
      <!-- search icon -->
      <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="5" stroke="#C8F56A" stroke-opacity="0.55" stroke-width="1.5"/>
        <path d="M11 11L14 14" stroke="#C8F56A" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input class="search-input" type="text" placeholder="Search Menu" />
    </div>

  </div>

  <!-- 4. TAB BAR — 390×68 -->
  <div class="tab-bar" id="tabBar">
    <!-- tabs injected by JS -->
  </div>

  <!-- 5. SCROLL AREA — 390×500 -->
  <div class="scroll-area" id="scrollArea">
    <!-- dish content injected by JS from assets/menu_final.json -->
  </div>

  <!-- 6. BOTTOM BAR — 390×66 -->
  <div class="bottom-bar" id="bottomBar">
    <!-- single dietary badge — updated when + is tapped -->
    <div class="diet-types" id="dietBadge" style="visibility:hidden;"></div>
    <!-- checkout counter -->
    <div class="checkout-counter" id="checkoutCounter">
      <img src="../assets/list.png" width="16" height="16" alt="cart" class="checkout-icon" />
      <span class="checkout-label">Checkout</span>
      <span class="checkout-items" id="checkoutItems">0 Items</span>
    </div>
  </div>

  <!-- 7. SAFE BOTTOM — 34px -->
  <div class="safe-bottom"></div>

</div>
<script src="../js/navigation.js"></script>
<script>
  /* ── Cart state ─────────────────────────────────────────── */
  var cart = {}; // { dishId: { dish, quantity } }

  function updateBottomBar(dish) {
    var totalItems = 0;
    Object.values(cart).forEach(function (e) { totalItems += e.quantity; });

    var badge     = document.getElementById('dietBadge');
    var itemsEl   = document.getElementById('checkoutItems');
    var bottomBar = document.getElementById('bottomBar');

    /* show dietary badge for the last tapped dish */
    var dtype = dish.dietary || (dish.veg ? 'veg' : 'non-veg');
    badge.className = 'diet-types ' + dtype.replace('-', '');
    if (dtype === 'veg')     badge.textContent = 'Veg';
    else if (dtype === 'vegan') badge.textContent = 'Vegan';
    else                     badge.textContent = 'Non Veg';
    badge.style.visibility = 'visible';

    itemsEl.textContent = totalItems + (totalItems === 1 ? ' Item' : ' Items');
    bottomBar.style.display = 'flex';
  }

  /* ── Read ?category= from URL ────────────────────────────── */
  var params   = new URLSearchParams(window.location.search);
  var category = (params.get('category') || 'breakfast').toLowerCase();

  /* ── Render tabs ─────────────────────────────────────────── */
  var tabBar    = document.getElementById('tabBar');
  var scrollArea = document.getElementById('scrollArea');
  var activeTab = 0;
  var menuData  = null;
  var tabs      = [];   // sub-tab labels — derived from menu.json[category] keys

  function renderTabs() {
    tabBar.innerHTML = '';
    tabs.forEach(function (label, i) {
      var btn = document.createElement('button');
      btn.className = 'tab-pill' + (i === activeTab ? ' active' : '');
      btn.textContent = label;
      btn.addEventListener('click', function () {
        activeTab = i;
        renderTabs();
        renderDishes();
      });
      tabBar.appendChild(btn);
    });
  }

  /* ── Build a single food-item row ────────────────────────── */
  function buildFoodItem(dish) {
    var row = document.createElement('div');
    row.className = 'food-item';

    if (dish.available) {
      row.classList.add('clickable');
      row.addEventListener('click', function () {
        var detailParams = new URLSearchParams();
        detailParams.set('id', dish.id);
        detailParams.set('category', category);
        navigateTo('detail-view.html?' + detailParams.toString());
      });
    }

    var dot = document.createElement('span');
    var dtype = dish.dietary || (dish.veg ? 'veg' : 'non-veg');
    dot.className = 'diet-dot ' + dtype.replace('-', '');
    row.appendChild(dot);

    var nameGroup = document.createElement('div');
    nameGroup.className = 'dish-name-group';

    var nameEl = document.createElement('span');
    nameEl.className = 'dish-name' + (dish.available ? '' : ' unavailable');
    nameEl.textContent = dish.name;
    nameGroup.appendChild(nameEl);

    if (!dish.available) {
      var badge = document.createElement('span');
      badge.className = 'sold-out-badge';
      badge.textContent = 'Sold Out';
      nameGroup.appendChild(badge);
    }
    row.appendChild(nameGroup);

    var priceGroup = document.createElement('div');
    priceGroup.className = 'dish-price-group';

    var priceEl = document.createElement('span');
    priceEl.className = 'dish-price' + (dish.available ? '' : ' unavailable');
    priceEl.textContent = '₹ ' + dish.price;
    priceGroup.appendChild(priceEl);

    var disabledAttrs = dish.available ? '' : ' disabled style="opacity:0.25;pointer-events:none;"';

    var stepperBtn = document.createElement('button');
    stepperBtn.className = 'icon-stepper';
    stepperBtn.title = 'Add';
    stepperBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3V13M3 8H13" stroke="#C8F56A" stroke-width="1.5" stroke-linecap="round"/></svg>';
    stepperBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (cart[dish.id]) {
        cart[dish.id].quantity += 1;
      } else {
        cart[dish.id] = { dish: dish, quantity: 1 };
      }
      updateBottomBar(dish);
    });
    if (!dish.available) {
      stepperBtn.disabled = true;
      stepperBtn.style.opacity = '0.25';
      stepperBtn.style.pointerEvents = 'none';
    }
    priceGroup.appendChild(stepperBtn);

    var editBtn = document.createElement('button');
    editBtn.className = 'icon-edit';
    editBtn.title = 'Edit / View';
    editBtn.innerHTML = '<img src="../assets/Menu Icons/edit-icon.svg" width="16" height="16" alt="edit" />';
    editBtn.addEventListener('click', function (e) { e.stopPropagation(); });
    if (!dish.available) {
      editBtn.disabled = true;
      editBtn.style.opacity = '0.25';
      editBtn.style.pointerEvents = 'none';
    }
    priceGroup.appendChild(editBtn);

    row.appendChild(priceGroup);
    return row;
  }

  /* ── Render dishes for the active sub-tab ────────────────── */
  function renderDishes() {
    scrollArea.innerHTML = '';

    if (!menuData) return;

    var subTabLabel = tabs[activeTab];
    var dishes = (menuData[category] && menuData[category][subTabLabel]) || [];

    var subHeader = document.createElement('div');
    subHeader.className = 'sub-header';
    subHeader.innerHTML =
      '<span class="sub-header-label">' + subTabLabel.toUpperCase() + '</span>' +
      '<span class="sub-header-line"></span>';
    scrollArea.appendChild(subHeader);

    dishes.forEach(function (dish) {
      scrollArea.appendChild(buildFoodItem(dish));
    });
  }

  /* ── Search ──────────────────────────────────────────────── */
  var searchInput = document.querySelector('.search-input');

  function renderSearch(query) {
    scrollArea.innerHTML = '';
    if (!menuData) return;

    var q = query.trim().toLowerCase();
    var categoryData = menuData[category] || {};
    var hasResults = false;

    Object.keys(categoryData).forEach(function (subLabel) {
      var matches = categoryData[subLabel].filter(function (dish) {
        return dish.name.toLowerCase().includes(q) ||
               (dish.description && dish.description.toLowerCase().includes(q));
      });
      if (!matches.length) return;
      hasResults = true;

      var subHeader = document.createElement('div');
      subHeader.className = 'sub-header';
      subHeader.innerHTML =
        '<span class="sub-header-label">' + subLabel.toUpperCase() + '</span>' +
        '<span class="sub-header-line"></span>';
      scrollArea.appendChild(subHeader);

      matches.forEach(function (dish) {
        scrollArea.appendChild(buildFoodItem(dish));
      });
    });

    if (!hasResults) {
      var empty = document.createElement('div');
      empty.style.cssText = 'padding:32px 16px;text-align:center;color:var(--ev-white-dim);font-family:var(--font-sans);font-size:14px;';
      empty.textContent = 'No dishes found for "' + query.trim() + '"';
      scrollArea.appendChild(empty);
    }
  }

  searchInput.addEventListener('input', function () {
    var q = searchInput.value;
    if (q.trim() === '') {
      tabBar.style.display = '';
      renderTabs();
      renderDishes();
    } else {
      tabBar.style.display = 'none';
      renderSearch(q);
    }
  });

  /* restore tabs when input is cleared via × or keyboard */
  searchInput.addEventListener('search', function () {
    if (searchInput.value === '') {
      tabBar.style.display = '';
      renderTabs();
      renderDishes();
    }
  });

  /* ── Load menu.json, derive tabs from category object, render ── */
  fetch('../assets/menu_final.json')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      menuData = data;
      var categoryData = menuData[category] || {};
      tabs = Object.keys(categoryData);
      activeTab = 0;
      renderTabs();
      renderDishes();
    })
    .catch(function (err) {
      console.error('Failed to load menu.json', err);
    });
</script>
</body>
</html>
