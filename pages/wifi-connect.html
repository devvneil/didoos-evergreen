<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Connect to WiFi at Didoo's Evergreen Café" />
  <title>WiFi Connect — Didoo's Evergreen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/pages/wifi.css" />
</head>
<body>
<div class="shell">

  <div class="safe-top"></div>

  <!-- MENU COMPONENT HEADER -->
  <header class="menu-component">
    <img class="menu-logo" src="../assets/Welcome Logo.svg" alt="Didoo's Evergreen" />
  </header>

  <!-- GUIDELINE CONTENT — 390×545 -->
  <main class="guideline-content" aria-label="WiFi Connect">

    <h2 class="wifi-title">Connect to wifi</h2>

    <!-- Credentials card -->
    <div class="wifi-card">
      <div class="wifi-row">
        <span class="wifi-credential">Network:</span>
        <span class="wifi-credential">evergreen_wifi</span>
      </div>
      <div class="wifi-row">
        <span class="wifi-credential">Password:</span>
        <span class="wifi-credential">xxyz@ttw</span>
      </div>
    </div>

    <!-- Instructions -->
    <div class="wifi-instructions">
      <span class="wifi-instructions-header">How to connect</span>
      <span class="wifi-step">1.  Open your phone Settings</span>
      <span class="wifi-step">2.  Tap WiFi</span>
      <span class="wifi-step">3.  Select "evergreen wifi"</span>
      <span class="wifi-step">4.  Enter the password</span>
      <span class="wifi-step">5.  Return here and tap I'm Connected</span>
      <span class="page-note">Tapping "I'm Connected" will begin your Didoo's Evergreen Café experience.</span>
    </div>

  </main>

  <!-- BTN CONTENT -->
  <div class="btn-content">
    <button class="btn-primary" onclick="navigateTo('house-guidelines.html')">I'm Connected</button>
  </div>

  <div class="safe-bottom"></div>

</div>
<script src="../js/navigation.js"></script>
</body>
</html>
