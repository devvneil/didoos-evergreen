<script src="../js/navigation.js"></script>
<script>
  function navigateTo(page) {
    document.querySelector('.shell').style.transition = 'transform 300ms ease-out, opacity 300ms ease-out';
    document.querySelector('.shell').style.transform = 'translateX(-100%)';
    document.querySelector('.shell').style.opacity = '0';
    setTimeout(function () { window.location.href = page; }, 300);
  }
</script>
