<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Indian Menu — Didoo's Evergreen Café" />
  <title>Indian Menu — Didoo's Evergreen</title>
  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/pages/main-indian.css" />
</head>
<body>
<div class="shell">

  <!-- 1. SAFE TOP — 44px -->
  <div class="safe-top"></div>

  <!-- 2. TOP BAR — 390×55 -->
  <div class="top-bar">

    <!-- Back button — 70×26 | navigates to main-menu with slide-right -->
    <button class="topbar-back" onclick="navigateBack('main-menu.html')">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M8.75 11.5L4.25 7L8.75 2.5" stroke="#C8F56A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back
    </button>

    <!-- Welcome logo — 97×31 -->
    <img class="topbar-logo" src="../assets/Welcome Logo.svg" alt="Didoo's Evergreen" />

  </div>

  <!-- 3. SEARCH BAR — 390×77 -->
  <div class="search-bar">

    <div class="search-input-wrap">
      <!-- search icon -->
      <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="5" stroke="#C8F56A" stroke-opacity="0.55" stroke-width="1.5"/>
        <path d="M11 11L14 14" stroke="#C8F56A" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input class="search-input" type="text" placeholder="Search Menu" />
    </div>

  </div>

  <!-- 4. TAB BAR — 390×68 -->
  <div class="tab-bar" id="tabBar">
    <!-- tabs injected by JS -->
  </div>

  <!-- 5. SCROLL AREA — 390×500 -->
  <div class="scroll-area" id="scrollArea">

    <!-- Subheader -->
    <div class="sub-header">
      <span class="sub-header-label">HEALTHY</span>
      <span class="sub-header-line"></span>
    </div>

    <!-- Food item — available -->
    <div class="food-item">
      <span class="diet-dot veg"></span>
      <div class="dish-name-group">
        <span class="dish-name">Healthy Yogurt</span>
      </div>
      <div class="dish-price-group">
        <span class="dish-price">₹ 280</span>
        <button class="icon-stepper" title="Add">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 3V13M3 8H13" stroke="#C8F56A" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-edit" title="Edit / View">
          <img src="../assets/Menu Icons/edit-icon.svg" width="16" height="16" alt="edit" />
        </button>
      </div>
    </div>

    <!-- Food item — sold out -->
    <div class="food-item">
      <span class="diet-dot veg"></span>
      <div class="dish-name-group">
        <span class="dish-name unavailable">Banana Honey Porridge</span>
        <span class="sold-out-badge">Sold Out</span>
      </div>
      <div class="dish-price-group">
        <span class="dish-price unavailable">₹ 200</span>
        <button class="icon-stepper" title="Add" disabled style="opacity:0.25;pointer-events:none;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 3V13M3 8H13" stroke="#C8F56A" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-edit" title="Edit / View" disabled style="opacity:0.25;pointer-events:none;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 2.5C2 2.22 2.22 2 2.5 2H9.5L12 4.5V13.5C12 13.78 11.78 14 11.5 14H2.5C2.22 14 2 13.78 2 13.5V2.5Z" stroke="rgba(255,255,255,0.55)" stroke-width="1.2"/>
            <path d="M10.5 11L14 7.5L12.5 6L9 9.5V11H10.5Z" fill="rgba(255,255,255,0.55)"/>
            <path d="M12.5 6L14 7.5" stroke="rgba(255,255,255,0.55)" stroke-width="0.8"/>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <!-- 6. BOTTOM BAR — 390×66 -->
  <div class="bottom-bar">
    <!-- summary / CTA -->
  </div>

  <!-- 7. SAFE BOTTOM — 34px -->
  <div class="safe-bottom"></div>

</div>
<script src="../js/navigation.js"></script>
<script>
  /* ── Category → sub-tab map ──────────────────────────────── */
  var TABS = {
    breakfast: ['Healthy', 'Eggs', 'Toast', 'Big Breakfast'],
    starters:  ['Salad', 'Soups', 'Appetisers', 'Loaded Fries'],
    israeli:   ['Shakshuka', 'Hummus', 'Pita', 'Falafel'],
    mains:     ['Curry', 'Rice', 'Biryani', 'Dal'],
    bakes:     ['Pizza', 'Calzone', 'Flatbread', 'Puffs'],
    drinks:    ['Hot', 'Cold', 'Smoothies', 'Juices'],
    desserts:  ['Cakes', 'Ice Cream', 'Pastries', 'Waffles']
  };

  /* ── Read ?category= from URL ────────────────────────────── */
  var params   = new URLSearchParams(window.location.search);
  var category = (params.get('category') || 'breakfast').toLowerCase();
  var tabs     = TABS[category] || TABS['breakfast'];

  /* ── Render tabs ─────────────────────────────────────────── */
  var tabBar    = document.getElementById('tabBar');
  var activeTab = 0;

  function renderTabs() {
    tabBar.innerHTML = '';
    tabs.forEach(function (label, i) {
      var btn = document.createElement('button');
      btn.className = 'tab-pill' + (i === activeTab ? ' active' : '');
      btn.textContent = label;
      btn.addEventListener('click', function () {
        activeTab = i;
        renderTabs();
      });
      tabBar.appendChild(btn);
    });
  }

  renderTabs();
</script>
</body>
</html>
