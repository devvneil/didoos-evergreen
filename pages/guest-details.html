<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Guest Details — Didoo's Evergreen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages/guest-details.css" />
</head>
<body>
<div class="shell">

  <div class="safe-top"></div>

  <!-- MENU COMPONENT HEADER — 390×144 -->
  <header class="menu-component">
    <img class="menu-logo" src="../assets/Welcome Logo.svg" alt="Didoo's Evergreen" />
  </header>

  <!-- GUIDELINE CONTENT — 390×545 -->
  <main class="guideline-content" aria-label="Guest Details">
    <h2 class="page-title">A little about you</h2>

    <!-- Full Name -->
    <div class="name-section input-section">
      <label class="input-label">Full Name</label>
      <input class="input-field" type="text" placeholder="Enter your full name" />
    </div>

    <!-- Mobile Number -->
    <div class="mobile-section input-section">
      <label class="input-label">Mobile Number</label>
      <div class="input-field mobile-input">
        <div class="country-dropdown" id="countryDropdown">
          <div class="country-selected" id="countrySelected">
            <span id="countryValue">+91</span>
            <svg class="mobile-arrow" viewBox="0 0 10 6" aria-hidden="true">
              <path d="M1 1l4 4 4-4"/>
            </svg>
          </div>
          <ul class="country-list" id="countryList"></ul>
        </div>
        <span class="mobile-sep">|</span>
        <input class="mobile-number" type="tel" placeholder="Enter your mobile number" />
      </div>
    </div>

    <!-- Email -->
    <div class="email-section input-section">
      <label class="input-label">Email</label>
      <input class="input-field" type="email" placeholder="Enter your email" />
    </div>

    <span class="details-note">Your details are collected solely to improve your experience at Didoo's Evergreen Café and will not be shared with third parties.</span>
  </main>

  <!-- BTN CONTENT — 390×77 -->
  <div class="btn-content">
    <button class="btn-primary" onclick="navigateTo('')">Submit</button>
  </div>

  <div class="safe-bottom"></div>

</div>
<script src="../js/navigation.js"></script>
<script>
  var dropdown = document.getElementById('countryDropdown');
  var countryValue = document.getElementById('countryValue');
  var countryList = document.getElementById('countryList');

  fetch('../assets/countries.json')
    .then(function(res) { return res.json(); })
    .then(function(countries) {
      countries.forEach(function(country) {
        var li = document.createElement('li');
        li.textContent = country.code + '  ' + country.name;
        li.dataset.code = country.code;
        if (country.name === 'India') li.classList.add('active');
        li.addEventListener('click', function() {
          countryValue.textContent = country.code;
          countryList.querySelectorAll('li').forEach(function(el) { el.classList.remove('active'); });
          li.classList.add('active');
          dropdown.classList.remove('open');
        });
        countryList.appendChild(li);
      });
    });

  document.getElementById('countrySelected').addEventListener('click', function(e) {
    e.stopPropagation();
    dropdown.classList.toggle('open');
  });

  document.addEventListener('click', function() {
    dropdown.classList.remove('open');
  });
</script>
<script>
  function navigateTo(page) {
    document.querySelector('.shell').style.transition = 'transform 300ms ease-out, opacity 300ms ease-out';
    document.querySelector('.shell').style.transform = 'translateX(-100%)';
    document.querySelector('.shell').style.opacity = '0';
    setTimeout(function () { window.location.href = page; }, 300);
  }
</script>
</body>
</html>
