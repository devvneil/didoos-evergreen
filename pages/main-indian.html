<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Indian Menu — Didoo's Evergreen Café" />
  <title>Indian Menu — Didoo's Evergreen</title>
  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/pages/main-indian.css" />
</head>
<body>
<div class="shell">

  <!-- 1. SAFE TOP — 44px -->
  <div class="safe-top"></div>

  <!-- 2. TOP BAR — 390×55 -->
  <div class="top-bar">

    <!-- Back button — 70×26 | navigates to main-menu with slide-right -->
    <button class="topbar-back" onclick="navigateBack('main-menu.html')">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M8.75 11.5L4.25 7L8.75 2.5" stroke="#C8F56A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back
    </button>

    <!-- Welcome logo — 97×31 -->
    <img class="topbar-logo" src="../assets/Welcome Logo.svg" alt="Didoo's Evergreen" />

  </div>

  <!-- 3. SEARCH BAR — 390×77 -->
  <div class="search-bar">

    <div class="search-input-wrap">
      <!-- search icon -->
      <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="5" stroke="#C8F56A" stroke-opacity="0.55" stroke-width="1.5"/>
        <path d="M11 11L14 14" stroke="#C8F56A" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input class="search-input" type="text" placeholder="Search Menu" />
    </div>

  </div>

  <!-- 4. TAB BAR — 390×68 -->
  <div class="tab-bar" id="tabBar">
    <!-- tabs injected by JS -->
  </div>

  <!-- 5. SCROLL AREA — 390×500 -->
  <div class="scroll-area" id="scrollArea">
    <!-- dish rows injected by JS -->
  </div>

  <!-- 6. BOTTOM BAR — 390×66 -->
  <div class="bottom-bar">
    <!-- summary / CTA -->
  </div>

  <!-- 7. SAFE BOTTOM — 34px -->
  <div class="safe-bottom"></div>

</div>
<script src="../js/navigation.js"></script>
<script>
  /* ── Read ?category= from URL ────────────────────────────── */
  var params      = new URLSearchParams(window.location.search);
  var category    = (params.get('category') || 'breakfast').toLowerCase();

  var tabBar      = document.getElementById('tabBar');
  var scrollArea  = document.getElementById('scrollArea');
  var activeTab   = 0;
  var menuData    = null;   /* loaded from menu.json */
  var tabs        = [];

  /* ── Fetch menu data then boot UI ───────────────────────── */
  fetch('../assets/menu.json')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      menuData = data;
      var catData = menuData[category] || {};
      tabs = Object.keys(catData);
      renderTabs();
      renderDishes();
    });

  /* ── Render tab pills ────────────────────────────────────── */
  function renderTabs() {
    tabBar.innerHTML = '';
    tabs.forEach(function (label, i) {
      var btn = document.createElement('button');
      btn.className = 'tab-pill' + (i === activeTab ? ' active' : '');
      btn.textContent = label;
      btn.addEventListener('click', function () {
        activeTab = i;
        renderTabs();
        renderDishes();
      });
      tabBar.appendChild(btn);
    });
  }

  /* ── Render dish rows ────────────────────────────────────── */
  function renderDishes() {
    scrollArea.innerHTML = '';
    if (!menuData || !tabs.length) return;

    var subTab  = tabs[activeTab];
    var dishes  = (menuData[category] || {})[subTab] || [];

    /* Section header */
    var header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML =
      '<span class="section-label">' + subTab.toUpperCase() + '</span>' +
      '<span class="section-line"></span>';
    scrollArea.appendChild(header);

    if (!dishes.length) {
      var empty = document.createElement('p');
      empty.style.cssText = 'color:rgba(255,255,255,0.3);font-size:13px;padding:24px 0;text-align:center;';
      empty.textContent = 'No items yet';
      scrollArea.appendChild(empty);
      return;
    }

    /* Dish rows */
    dishes.forEach(function (dish) {
      var row = document.createElement('div');
      row.className = 'dish-row' + (dish.available ? '' : ' sold-out');

      /* Dot type */
      var dotClass = dish.available
        ? (dish.veg ? 'veg' : 'nonveg')
        : 'soldout';

      /* AR / image button — shown if glb or image exists */
      var hasPreview = dish.glb || dish.image;
      var arBtnHtml  = hasPreview
        ? '<button class="dish-ar-btn" onclick="openPreview(\'' + dish.id + '\')" title="View 3D / Image">' +
            (dish.glb
              ? '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 2L2 5.5V12.5L9 16L16 12.5V5.5L9 2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M2 5.5L9 9M9 9L16 5.5M9 9V16" stroke="currentColor" stroke-width="1.3"/></svg>'
              : '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="3" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.3"/><circle cx="6.5" cy="7.5" r="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M2 12L6 8.5L9 11L12 8L16 12" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>'
            ) +
          '</button>'
        : '';

      row.innerHTML =
        '<div class="dish-left">' +
          '<div class="dish-name-row">' +
            '<span class="veg-dot ' + dotClass + '"></span>' +
            '<span class="dish-name">' + dish.name + '</span>' +
          '</div>' +
          (!dish.available ? '<span class="sold-out-badge">Sold Out</span>' : '') +
        '</div>' +
        '<div class="dish-right">' +
          '<span class="dish-price">₹ ' + dish.price + '</span>' +
          '<button class="dish-add-btn" title="Add to order">' +
            '<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 4V14M4 9H14" stroke="#C8F56A" stroke-width="1.8" stroke-linecap="round"/></svg>' +
          '</button>' +
          arBtnHtml +
        '</div>';

      scrollArea.appendChild(row);
    });
  }

  /* ── Open 3D / image preview ─────────────────────────────── */
  function openPreview(dishId) {
    var dish = null;
    var catData = menuData[category] || {};
    Object.values(catData).forEach(function (arr) {
      arr.forEach(function (d) { if (d.id === dishId) dish = d; });
    });
    if (!dish) return;
    if (dish.glb) {
      navigateTo('ar-experience.html');   /* pass to AR page — extend later */
    } else if (dish.image) {
      /* TODO: lightbox image */
    }
  }
</script>
</body>
</html>
