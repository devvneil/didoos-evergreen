<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Tell us a little about you — Didoo's Evergreen Café" />
  <title>Guest Details — Didoo's Evergreen</title>
  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/pages/guest-details.css" />
</head>
<body>
<div class="shell">

  <div class="safe-top"></div>

  <!-- MENU COMPONENT HEADER — 390×144 -->
  <header class="menu-component">
    <img class="menu-logo" src="../assets/Welcome Logo.svg" alt="Didoo's Evergreen" />
  </header>

  <!-- GUIDELINE CONTENT — 390×545 -->
  <main class="guideline-content" aria-label="Guest Details">
    <h2 class="page-title">A little about you</h2>

    <!-- Full Name -->
    <div class="name-section input-section">
      <label class="input-label">Full Name</label>
      <input class="input-field" id="nameInput" type="text" placeholder="Enter your full name" />
    </div>

    <!-- Mobile Number -->
    <div class="mobile-section input-section">
      <label class="input-label">Mobile Number</label>
      <div class="input-field mobile-input">
        <div class="country-dropdown" id="countryDropdown">
          <div class="country-selected" id="countrySelected">
            <span id="countryValue">+91</span>
            <svg class="mobile-arrow" viewBox="0 0 10 6" aria-hidden="true">
              <path d="M1 1l4 4 4-4"/>
            </svg>
          </div>
          <ul class="country-list" id="countryList"></ul>
        </div>
        <span class="mobile-sep">|</span>
        <input class="mobile-number" type="tel" placeholder="Enter your mobile number" />
      </div>
    </div>

    <!-- Email -->
    <div class="email-section input-section">
      <label class="input-label">Email</label>
      <input class="input-field" id="emailInput" type="email" placeholder="Enter your email" />
      <span class="email-error" id="emailError">Please enter a valid email address</span>
    </div>

    <span class="page-note">Your details are collected solely to improve your experience at Didoo's Evergreen Café and will not be shared with third parties.</span>
  </main>

  <!-- BTN CONTENT — 390×77 -->
  <div class="btn-content">
    <button class="btn-primary" id="submitBtn" onclick="submitGuest()">Submit</button>
  </div>

  <div class="safe-bottom"></div>

</div>
<script src="../js/navigation.js"></script>
<script src="../js/pages/guest.js"></script>
</body>
</html>
