<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Base Menu Design — Didoo's Evergreen Café" />
  <title>Base Menu Design — Didoo's Evergreen</title>
  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
</head>
<body>
<div class="shell">

  <!-- 1. SAFE TOP — 44px -->
  <div class="safe-top"></div>

  <!-- 2. TOP BAR — 390×55 | justify-content: space-between | padding: 12px 16px -->
  <div class="top-bar">
    <!-- left slot: back button / logo -->
    <!-- right slot: action icons (cart, filter…) -->
  </div>

  <!-- 3. SEARCH BAR — 390×77 | padding: 16px 8px | border-bottom: 1px -->
  <div class="search-bar">
    <!-- search input -->
  </div>

  <!-- 4. TAB BAR — 390×68 | gap: 8px | padding: 12px 16px | border-bottom: 1px -->
  <div class="tab-bar">
    <!-- category / filter tabs -->
  </div>

  <!-- 5. SCROLL AREA — 390×500 | padding: 12px 16px 0 | scrollable -->
  <div class="scroll-area">
    <!-- menu cards / list items -->
  </div>

  <!-- 6. BOTTOM BAR — 390×66 | justify-content: space-between | padding: 16px 12px | border-top: 1px lime -->
  <div class="bottom-bar">
    <!-- left: item count / summary -->
    <!-- right: CTA button -->
  </div>

  <!-- 7. SAFE BOTTOM — 34px -->
  <div class="safe-bottom"></div>

</div>
<script src="../js/navigation.js"></script>
</body>
</html>
